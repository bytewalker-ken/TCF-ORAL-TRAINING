<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TCF Québec Oral Lab — Tâche 2 & Tâche 3 practice" />
  <title>TCF Québec Oral Lab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">TCF</div>
      <div><h1>TCF Québec Oral Lab</h1><p>口语真题 · 母题 · 万能句 · 自我练习</p></div>
    </div>
    <div class="top-actions"><button id="randomBtn" class="primary">🎲 随机抽题</button><button id="examBtn">⏱ 模拟考试</button></div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button class="nav active" data-view="dashboard">🏠 学习首页</button>
      <button class="nav" data-view="task2">🗣️ Tâche 2 · Interaction</button>
      <button class="nav" data-view="task3">💬 Tâche 3 · Argumentation</button>
      <button class="nav" data-view="phrases">⭐ 14句核心万能句</button>
      <button class="nav" data-view="mistakes">❌ 我的错题</button>
      <div class="side-note"><b>颜色说明</b><span class="legend type">题型 / 题目</span><span class="legend answer">通用答案 / 万能句</span><span class="legend fill">自填内容</span></div>
    </aside>

    <main id="app" class="content"></main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="closeModal">×</button><div id="modalBody"></div></div></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
